<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <title>Cartograph</title>
  <!--
    The Cartograph sextant, kept in sync with src/components/Logo.tsx. Same
    circle (pivot 12.4,3 / limb r 13.4-16.3), same 60 degree limb, same -20
    rotation, same mounted hardware: index mirror at the pivot, horizon glass
    in the left frame side, telescope, micrometer drum on the arc.

    Two deliberate differences from the header mark, both for 16px: the limb's
    graduations are dropped (they silt up into a solid band) and the telescope
    is shortened (its far end reads as a detached speck). Stroke is heavier to
    match, 2 against the header's 1.4.

    Colors are literals rather than tokens because this file is served straight
    out of public/ and never sees tokens.css; they are the brand purple pair,
    color-brand-purple and its light variant. currentColor is no use either — a
    favicon is painted against the browser's chrome, not the app — so the two
    tab-bar themes are handled here instead. Stroke lives in the stylesheet
    rather than in presentation attributes so var() resolves reliably.

    Note for editors: this is XML, so a comment may never contain a double
    hyphen. Writing the CSS custom properties with their leading dashes here
    makes the whole file unparseable and the icon silently disappears.
  -->
  <style>
    :root { --c: #8b5cf6 }
    @media (prefers-color-scheme: dark) { :root { --c: #a78bfa } }
    .frame {
      fill: none;
      stroke: var(--c);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .mirror { fill: var(--c) }
  </style>
  <g transform="rotate(-20 12 12)">
    <g class="frame">
      <path d="M4.25 17.12A16.3 16.3 0 0 0 20.55 17.12L19.1 14.6A13.4 13.4 0 0 1 5.7 14.6Z"/>
      <path d="M12.4 3L9.1 8.72M7.1 12.18L4.25 17.12"/>
      <path d="M12.4 3L20.55 17.12"/>
      <path d="M12.4 3L12.4 19"/>
      <circle cx="12.4" cy="21" r="2"/>
      <circle cx="8.1" cy="10.45" r="2"/>
      <rect x="3" y="8.85" width="3.1" height="3.2" rx="1.6"/>
    </g>
    <circle class="mirror" cx="12.4" cy="3" r="1.75"/>
  </g>
</svg>
