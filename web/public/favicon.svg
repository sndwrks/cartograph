<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <title>Cartograph</title>
  <!--
    The Cartograph graph mark, kept in sync with src/components/Logo.tsx: one
    hub, satellites of varying size. Same construction: spokes drawn
    hub-center to satellite-center as plain lines, then filled circles painted
    over the endpoints, so draw order (edges first) is load-bearing. Same node
    positions.

    Two deliberate differences from the header mark, both for 16px: the small
    lower-left satellite is dropped (five spokes silt up into a blot), and
    everything is heavier to survive the shrink: node radii up by roughly half
    a unit, edge stroke 2 against the header's 1.25.

    Colors are literals rather than tokens because this file is served straight
    out of public/ and never sees tokens.css; they are the brand purple pair,
    color-brand-purple and its light variant. currentColor is no use either — a
    favicon is painted against the browser's chrome, not the app — so the two
    tab-bar themes are handled here instead. Paint lives in the stylesheet
    rather than in presentation attributes so var() resolves reliably.

    Note for editors: this is XML, so a comment may never contain a double
    hyphen. Writing the CSS custom properties with their leading dashes here
    makes the whole file unparseable and the icon silently disappears.
  -->
  <style>
    :root { --c: #8b5cf6 }
    @media (prefers-color-scheme: dark) { :root { --c: #a78bfa } }
    .edges {
      fill: none;
      stroke: var(--c);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nodes { fill: var(--c) }
  </style>
  <path class="edges" d="M11.5 12L4.5 5M11.5 12L18 4.5M11.5 12L20.5 14.5M11.5 12L14.5 20.5"/>
  <g class="nodes">
    <circle cx="11.5" cy="12" r="2.9"/>
    <circle cx="4.5" cy="5" r="2.6"/>
    <circle cx="18" cy="4.5" r="2.1"/>
    <circle cx="20.5" cy="14.5" r="2.5"/>
    <circle cx="14.5" cy="20.5" r="2.4"/>
  </g>
</svg>
