server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api {
        # Resolve `api` per request via Docker's embedded DNS instead of once
        # at config load: a literal hostname in proxy_pass is looked up at
        # startup and nginx exits with "host not found in upstream" if the api
        # container is being recreated at that moment (e.g. `up --build`
        # replacing api while web restarts). Using a variable defers the
        # lookup so web starts regardless and recovers on its own.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        # No URI part on the target, so the request URI is forwarded verbatim
        # (same as the literal `proxy_pass http://api:8000;` it replaces).
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
