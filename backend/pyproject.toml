[project]
name = "cartograph"
version = "0.1.0"
description = "Self-hosted codebase knowledge graph"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg==0.31.0",
    "alembic>=1.19.1",
    "pgvector==0.5.0",
    # core 0.26 segfaults on Node.start_byte for trees from the 0.23-ABI
    # typescript grammar (0.23.2 is the newest published); hold at 0.25.x
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-javascript==0.25.0",
    "python-igraph>=1.0.0",
    "mcp>=2.0.0",
    "anthropic>=0.122.0",
    "voyageai>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartograph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# one shared loop: the session-scoped async engine's connections are loop-bound
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Applied automatically by fixture closure in tests/conftest.py — do not hand-mark.
markers = ["integration: requires a live Postgres (pgvector + pg_trgm)"]
# --strict-markers: a typo'd -m expression must error, not select nothing silently
addopts = "--strict-markers"
